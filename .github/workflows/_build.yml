# Shared build body. One thin caller workflow per preset sits next to this file
# so every target gets its own status badge; they all call in here.
name: _build

on:
  workflow_call:
    inputs:
      preset:
        required: true
        type: string
      os:
        required: true
        type: string
      cuda:
        default: false
        type: boolean
      vulkan:
        default: false
        type: boolean

jobs:
  build:
    name: ${{ inputs.preset }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # GTK + WebKitGTK back the native window; Ninja drives every preset here.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: CUDA toolkit
        if: inputs.cuda
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          method: network
          # nvcc plus the libraries ggml-cuda links against.
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust"]'

      - name: Vulkan SDK
        if: inputs.vulkan
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang
          vulkan-use-cache: true

      - name: Configure
        run: cmake --preset ${{ inputs.preset }}

      - name: Build
        run: cmake --build --preset ${{ inputs.preset }}

      - name: Package
        working-directory: build/${{ inputs.preset }}
        run: cpack

      - uses: actions/upload-artifact@v4
        with:
          name: transcriptor-${{ inputs.preset }}
          path: |
            build/${{ inputs.preset }}/*.zip
            build/${{ inputs.preset }}/*.dmg
            build/${{ inputs.preset }}/*.tar.gz
          if-no-files-found: error
