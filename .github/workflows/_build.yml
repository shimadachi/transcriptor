# Shared build body. One thin caller workflow per preset sits next to this file
# so every target gets its own status badge; they all call in here.
name: _build

on:
  workflow_call:
    inputs:
      preset:
        required: true
        type: string
      os:
        required: true
        type: string
      cuda:
        default: false
        type: boolean
      vulkan:
        default: false
        type: boolean
      # Set by release.yml to the tag being cut. When it is set the package
      # goes straight onto the draft Release and never becomes an artifact:
      # release assets are storage of a different kind, and a release's worth
      # of packages is more than twice the whole artifact allowance.
      release_tag:
        default: ''
        type: string

jobs:
  build:
    name: ${{ inputs.preset }}
    runs-on: ${{ inputs.os }}
    # The CUDA presets are the long pole: nvcc compiles every kernel once per
    # architecture. The CPU baseline fix set GGML_NATIVE=OFF, which as a side
    # effect flipped ggml's CUDA default from "native" (one architecture) to a
    # list of eight, and took win-cuda from ~42 min to ~2h15m.
    # cmake/dependencies.cmake now pins the list explicitly, decoupled from the
    # CPU baseline, which brings it back to five. 330 still leaves real headroom
    # under GitHub's own 360 ceiling for a cold-cache run.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      # GTK + WebKitGTK back the native window; Ninja drives every preset here.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja

      # cuBLAS ships as libcublas / libcublas-dev, which do NOT take the
      # "cuda-" prefix the sub-packages input applies — hence the second list.
      # visual_studio_integration is what lets CMake identify nvcc on Windows.
      #
      # The toolkit version is pinned, and the window is narrow. CUDA 13 removed
      # Pascal, Maxwell and Volta outright — building 61-virtual there is a hard
      # "nvcc fatal : Unsupported gpu architecture", so 13.x would silently drop
      # every GTX 10xx user. Blackwell SASS, meanwhile, needs 12.8 or newer.
      # Only 12.8/12.9 satisfies both, and v0.2.19 could not reach it: it tops
      # out at 12.6.2 and defaulted to 12.6.1, so RTX 50xx was falling back to
      # JIT. Hence the action bump alongside the pin.
      #
      # Staying on 12.x also keeps the driver floor low: the bundled 12.9
      # runtime runs on any 525+ driver thanks to CUDA minor version
      # compatibility, where 13.x would demand 580+ from end users.
      - name: CUDA toolkit
        if: inputs.cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.2'
          method: network
          sub-packages: >-
            ${{ runner.os == 'Windows'
                && '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
                || '["nvcc", "cudart", "cccl"]' }}
          non-cuda-sub-packages: >-
            ${{ runner.os == 'Windows' && '[]' || '["libcublas", "libcublas-dev"]' }}

      # The distro packages are enough for ggml-vulkan (headers, loader, glslc)
      # and avoid building glslang from source, which needs SPIR-V Tools too.
      # spirv-headers is what supplies SPIRV-HeadersConfig.cmake, which
      # ggml-vulkan has required via find_package since it started compiling
      # its shaders against the SPIR-V headers directly.
      - name: Vulkan (Linux)
        if: inputs.vulkan && runner.os == 'Linux'
        run: sudo apt-get install -y libvulkan-dev glslc glslang-tools spirv-tools spirv-headers

      - name: Vulkan SDK (Windows)
        if: inputs.vulkan && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      # Every run recompiles all 126 CUDA translation units from scratch, so a
      # one-line change under web/ or src/ has been costing the same three
      # hours as a dependency bump. The pins in cmake/dependencies.cmake are
      # released tags that rarely move, so the objects are reusable across runs
      # — cache them and an unchanged-deps build is mostly a link.
      #
      # Ninja, unlike the Visual Studio generator, does not locate the MSVC
      # toolchain itself — cl.exe has to already be on PATH. The win-* presets
      # moved to Ninja so ccache could work at all there (it supports MSVC only
      # under the Ninja and NMake generators), which makes this step the price
      # of admission. It also supplies the target architecture that the presets
      # used to carry in the VS-generator-only "architecture" field.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ inputs.preset }}
          max-size: 2G

      # CMake initialises CMAKE_<LANG>_COMPILER_LAUNCHER from the matching
      # environment variable, so this needs no preset or command-line change.
      # Explicitly bash: the default shell on the Windows runners is pwsh,
      # where this redirect syntax does not mean what it does here.
      - name: Route compilers through ccache
        shell: bash
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"    >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"  >> "$GITHUB_ENV"
          echo "CMAKE_CUDA_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ inputs.preset }}

      - name: Build
        run: cmake --build --preset ${{ inputs.preset }}

      # Before Package on purpose: there is no point shipping an artifact that
      # fails its own regression tests. They add a couple of seconds even to the
      # CUDA presets — no models, no audio device, no network.
      #
      # --no-tests=error because ctest exits 0 when it finds nothing to run, so
      # a suite that quietly stopped being registered would look exactly like a
      # passing one. Two of the five are POSIX-only and the UI suite is skipped
      # where node is absent, so the count differs per platform; zero is the
      # only number that means something has gone wrong.
      # Explicitly bash for the same reason the ccache step is: the default
      # shell on the Windows runners is pwsh.
      #
      # The Vulkan presets import the loader implicitly -- vulkan-1.dll is the
      # only non-system entry in the binary's import table -- so nothing built
      # from them starts at all unless the loader is on the search path, and it
      # fails before main() with 0xc0000135 and no output of its own. On a
      # user's machine the GPU driver supplies it; on a runner it comes with the
      # SDK, which is not on PATH by default. Harmless where it is already
      # resolvable, and the echo makes a future failure explain itself.
      #
      # The CUDA presets have the same shape of problem with libcuda.so.1, and
      # no equivalent way out: that library belongs to the driver, and a runner
      # has the toolkit but no NVIDIA card to install one. Only the lifecycle
      # test links transcriptor_core, so it is the only one that pulls in
      # ggml-cuda and dies in the loader before main(). The toolkit ships a stub
      # for exactly this -- it resolves every driver symbol and fails every call
      # -- and failing calls are all the tests need: they set device "cpu" and
      # load no model, so nothing asks the stub for a GPU. It is shipped under
      # its link name, libcuda.so, while the binary asks for the SONAME, so the
      # symlink is the whole trick.
      #
      # Windows gets no such reprieve. The stub is a Linux-only part of the
      # toolkit -- nvcuda.dll belongs to the driver, is not redistributable, and
      # has no import-library equivalent to borrow -- so on win-cuda that one
      # test cannot start at all, and reports 0xc0000135 with nothing to say for
      # itself. Excluded there rather than left red: every other preset runs it,
      # win-msvc and win-vulkan included, so the lifecycle stays covered on
      # Windows and under CUDA, just not on both at once. Anchored so the
      # pattern cannot quietly grow to swallow a second test.
      - name: Test
        shell: bash
        run: |
          exclude=()
          if [ "$RUNNER_OS" = "Windows" ] && [ "${{ inputs.cuda }}" = "true" ]; then
            echo "Skipping recording_lifecycle: no nvcuda.dll on this runner."
            exclude=(-E '^recording_lifecycle$')
          fi
          if [ "$RUNNER_OS" = "Linux" ] && [ "${{ inputs.cuda }}" = "true" ]; then
            stub=$(find "${CUDA_PATH:-/usr/local/cuda}" -name libcuda.so -path '*stubs*' \
                   2>/dev/null | head -1)
            echo "CUDA_PATH     : ${CUDA_PATH:-unset}"
            echo "libcuda stub  : ${stub:-NOT PRESENT IN TOOLKIT}"
            if [ -n "$stub" ]; then
              mkdir -p "$RUNNER_TEMP/cuda-stub"
              ln -sf "$stub" "$RUNNER_TEMP/cuda-stub/libcuda.so.1"
              export LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-stub${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$VULKAN_SDK" ]; then
            # $VULKAN_SDK is a Windows path, so it cannot go into a
            # colon-separated PATH -- the drive letter splits it. Copy the
            # loader beside the binaries instead; Windows searches the
            # executable's own directory first, which sidesteps PATH entirely.
            sdk=$(cygpath -u "$VULKAN_SDK" 2>/dev/null || printf '%s' "$VULKAN_SDK")
            loader=$(find "$sdk" -name vulkan-1.dll 2>/dev/null | head -1)
            echo "Vulkan SDK    : $sdk"
            echo "vulkan-1.dll  : ${loader:-NOT PRESENT IN SDK}"
            if [ -n "$loader" ]; then
              cp "$loader" "build/${{ inputs.preset }}/tests/" 2>/dev/null || true
            fi
          fi
          ctest --test-dir "build/${{ inputs.preset }}" --output-on-failure --no-tests=error \
                "${exclude[@]}"

      - name: Package
        working-directory: build/${{ inputs.preset }}
        run: cpack

      # A release package goes onto the draft Release the moment it is built,
      # rather than travelling there as an artifact. The old route uploaded
      # eight packages -- ~1.2 GB, and 1.1 GB of that is the two CUDA ones --
      # into a 500 MB artifact allowance, only for release.yml to download them
      # again minutes later and attach them here anyway.
      #
      # --clobber so a re-run of a half-finished release replaces its own
      # assets instead of colliding with them. nullglob because only one of the
      # three patterns matches on any given platform, and an unmatched glob
      # would otherwise be handed to gh as a literal filename.
      - name: Attach to the release
        if: inputs.release_tag != ''
        shell: bash
        working-directory: build/${{ inputs.preset }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(*.zip *.dmg *.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::cpack produced no package for ${{ inputs.preset }}"
            exit 1
          fi
          printf 'attaching: %s\n' "${files[@]}"
          gh release upload "${{ inputs.release_tag }}" "${files[@]}" --clobber

      # Every other run is someone wanting the build behind a commit, and a
      # week is longer than that interest lasts. The repo default is 90 days,
      # which is how this came to hold 25 GB against that same allowance.
      - uses: actions/upload-artifact@v4
        if: inputs.release_tag == ''
        with:
          name: transcriptor-${{ inputs.preset }}
          path: |
            build/${{ inputs.preset }}/*.zip
            build/${{ inputs.preset }}/*.dmg
            build/${{ inputs.preset }}/*.tar.gz
          if-no-files-found: error
          retention-days: 7
