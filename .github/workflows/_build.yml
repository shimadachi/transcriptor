# Shared build body. One thin caller workflow per preset sits next to this file
# so every target gets its own status badge; they all call in here.
name: _build

on:
  workflow_call:
    inputs:
      preset:
        required: true
        type: string
      os:
        required: true
        type: string
      cuda:
        default: false
        type: boolean
      vulkan:
        default: false
        type: boolean

jobs:
  build:
    name: ${{ inputs.preset }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # GTK + WebKitGTK back the native window; Ninja drives every preset here.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja

      # cuBLAS ships as libcublas / libcublas-dev, which do NOT take the
      # "cuda-" prefix the sub-packages input applies — hence the second list.
      # visual_studio_integration is what lets CMake identify nvcc on Windows.
      - name: CUDA toolkit
        if: inputs.cuda
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          method: network
          sub-packages: >-
            ${{ runner.os == 'Windows'
                && '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
                || '["nvcc", "cudart", "cccl"]' }}
          non-cuda-sub-packages: >-
            ${{ runner.os == 'Windows' && '[]' || '["libcublas", "libcublas-dev"]' }}

      # The distro packages are enough for ggml-vulkan (headers, loader, glslc)
      # and avoid building glslang from source, which needs SPIR-V Tools too.
      - name: Vulkan (Linux)
        if: inputs.vulkan && runner.os == 'Linux'
        run: sudo apt-get install -y libvulkan-dev glslc glslang-tools spirv-tools

      - name: Vulkan SDK (Windows)
        if: inputs.vulkan && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Configure
        run: cmake --preset ${{ inputs.preset }}

      - name: Build
        run: cmake --build --preset ${{ inputs.preset }}

      - name: Package
        working-directory: build/${{ inputs.preset }}
        run: cpack

      - uses: actions/upload-artifact@v4
        with:
          name: transcriptor-${{ inputs.preset }}
          path: |
            build/${{ inputs.preset }}/*.zip
            build/${{ inputs.preset }}/*.dmg
            build/${{ inputs.preset }}/*.tar.gz
          if-no-files-found: error
